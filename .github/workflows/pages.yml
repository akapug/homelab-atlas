# Builds the Recipe Maker page from recipe-maker/ and publishes it with GitHub Pages.
# The page is generated (index.html, page/*.js), so it is built here and never committed.
name: Recipe Maker page

on:
  push:
    branches: [main]
    paths:
      - 'recipe-maker/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the page
        working-directory: recipe-maker
        run: python3 build.py
      - name: Collect what index.html loads
        run: |
          mkdir -p _site/src
          cp recipe-maker/index.html _site/
          cp -r recipe-maker/page _site/page
          cp recipe-maker/src/app.css recipe-maker/src/model.js recipe-maker/src/app.js _site/src/
          touch _site/.nojekyll
          # every local file index.html names must be in the site
          python3 - <<'PY'
          import os, re
          html = open('_site/index.html').read()
          refs = [r for r in re.findall(r'(?:src|href)="([^"#]+)"', html) if ':' not in r]
          missing = [r for r in refs if not os.path.isfile(os.path.join('_site', r))]
          assert not missing, missing
          print('site ok:', len(refs), 'files')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
